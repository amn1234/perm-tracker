name: Scheduled API Case Check

on:
  schedule:
    # Trigger every 5 minutes between 9:00 PM and 11:55 PM EST daily
    # 9:00 PM EST = 1:00 AM UTC (Next day)
    - cron: '*/5 1-3 * * *'
  workflow_dispatch: # Allows you to manually click a button on GitHub to test run it anytime

jobs:
  api-fetch-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install request handlers
        run: pip install -r requirements.txt

      - name: Execute API Probe
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python test.py

      # Automatically saves any tracking updates back to your git project
      - name: Commit and Push state log tracking changes
        run: |
          git config --global user.name "git-pipeline-bot"
          git config --global user.email "bot@github.com"
          git add last_known_date.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update tracking status date baseline" && git push)
