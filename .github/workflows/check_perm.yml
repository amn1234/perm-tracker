name: Scheduled API Case Check

on:
  schedule:
    # Triggers EXACTLY ONCE a day at 9:00 PM EST (1:00 AM UTC next day)
    - cron: '7 1 * * *'
  workflow_dispatch: # Keeps manual trigger active for testing

jobs:
  api-fetch-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Playwright System Browsers
        run: playwright install chromium --with-deps

      # Setting a 3-hour job timeout limit for safety
      - name: Execute Looping Live Probe
        timeout-minutes: 180 
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python test.py
